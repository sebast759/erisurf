# Erisurf watchdog (9 Nov 2026): catches the runs that never happen (PC off or
# asleep, scheduler stuck), which the PC itself cannot report. Every hour in
# the day it reads erisurf.com's own "last report" time; if it is over 3h old
# the job fails, and GitHub emails the repo owner about the failed run.
# One mail per outage: it fails in the first hour past 3h, plus at the first
# check of the day (that is when a missed 07:30 run would show).
name: erisurf watchdog
on:
  schedule:
    - cron: "5 9-19 * * *"
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is erisurf.com fresh?
        shell: python
        run: |
          import re, sys, time, urllib.request
          from datetime import datetime, timezone
          url = f"https://erisurf.com/?watchdog={int(time.time())}"
          req = urllib.request.Request(url, headers={"Cache-Control": "no-cache",
                                                     "User-Agent": "erisurf-watchdog"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          m = re.search(r'data-report="(\d+)"', html)
          if not m:
              print("::error::erisurf.com has no report time in its page")
              sys.exit(1)
          age_h = (time.time() * 1000 - int(m.group(1))) / 3.6e6
          last = datetime.fromtimestamp(int(m.group(1)) / 1000, timezone.utc)
          hour = datetime.now(timezone.utc).hour
          print(f"last report {last:%Y-%m-%d %H:%M} UTC, {age_h:.1f} h ago")
          if age_h > 3 and (age_h <= 4 or hour == 9):
              print(f"::error::Erisurf has not updated for {age_h:.1f} h "
                    f"(last report {last:%a %H:%M} UTC). Is the PC on and the "
                    f"surf-report task running?")
              sys.exit(1)
